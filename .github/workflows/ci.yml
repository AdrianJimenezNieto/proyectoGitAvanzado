name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
    # El commit del README que sube el propio workflow no vuelve a dispararlo
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          # develop está protegida: el GITHUB_TOKEN no puede subir a ella, el token del owner sí
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.README_TOKEN }}

      - name: Averiguar la rama de la feature
        id: rama
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA_PR: ${{ github.head_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            rama="$RAMA_PR"
          else
            # Tras el merge, la rama sale del pull request al que pertenece el commit
            rama=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.ref // empty')
            rama="${rama:-$GITHUB_REF_NAME}"
          fi
          echo "Rama: $rama"
          echo "rama=$rama" >> "$GITHUB_OUTPUT"

      - name: Añadir la línea al README
        env:
          RAMA: ${{ steps.rama.outputs.rama }}
        run: |
          if [ ! -f README.md ]; then
            echo "No hay README.md en la rama."
            exit 1
          fi
          [ -n "$(tail -c1 README.md)" ] && echo >> README.md
          echo "- Añadida feature: $RAMA" >> README.md
          git diff README.md

      - name: Subir el README a develop
        # En un pull request el código es el merge provisional y no hay rama donde subirlo
        if: github.event_name != 'pull_request'
        env:
          RAMA: ${{ steps.rama.outputs.rama }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Añadir al README la feature $RAMA"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: DEV_TOKEN frente a LOCAL_DEV_TOKEN
        shell: powershell
        env:
          SECRET_DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          $secret = $env:SECRET_DEV_TOKEN
          $local = $env:LOCAL_DEV_TOKEN

          if ([string]::IsNullOrEmpty($secret)) {
            Write-Host "El secret DEV_TOKEN no llega al job."
            exit 1
          }
          if ([string]::IsNullOrEmpty($local)) {
            Write-Host "La variable LOCAL_DEV_TOKEN no existe en el runner."
            Write-Host "El runner solo ve las variables que ya existian cuando arranco: reinicialo."
            exit 1
          }

          if ($secret -ceq $local) {
            Write-Host "COINCIDEN: el secret DEV_TOKEN y la variable local LOCAL_DEV_TOKEN tienen el mismo valor."
            exit 0
          }

          Write-Host "NO COINCIDEN: el secret DEV_TOKEN y la variable local LOCAL_DEV_TOKEN son distintos."
          exit 1
